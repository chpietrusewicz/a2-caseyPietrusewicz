<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <form id="groceries">
      <label for='item'>Item:</label>
      <input type='text' id='item' name="item" placeholder='eg. Milk' required>
      <label for='category'>Category:</label>
      <select id='category' name="category" required>
        <option value='Fridge'>Fridge</option>
        <option value='Pantry'>Pantry</option>
        <option value='Freezer'>Freezer</option>
        <option value='Cleaning'>Cleaning</option>
        <option value='Household'>Household</option>
        <option value='Other'>Other</option>
      </select>
      <label for='quantity'>Quantity:</label>
      <input type='number' id='quantity' name="quantity" min="0" placeholder='eg. 1' required>
      <label for='utilization'>Utilization:</label>
      <select id='utilization' name="utilization" required>
        <option value='High'>High</option>
        <option value='Low'>Low</option>
      </select>
      <button type="submit">submit</button>
    </form>

    <table id="grocery-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Quantity</th>
          <th>Utilization</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </body>
</html>
